name: Build, and deploy ASP.NET Core app to Azure Web App - nooshapp-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore Web project
        run: dotnet restore NooshApp.Web/NooshApp.Web.csproj

      - name: Build Web project
        run: dotnet build NooshApp.Web/NooshApp.Web.csproj --configuration Release --no-restore

      - name: Publish Web project
        run: dotnet publish NooshApp.Web/NooshApp.Web.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nooshapp-web-wil'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
