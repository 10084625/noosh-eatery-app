name: Build, test and deploy ASP.NET Core API to Azure Web App - nooshapp-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore API project
        run: dotnet restore NooshApp.Api/NooshApp.Api.csproj

      - name: Build API project
        run: dotnet build NooshApp.Api/NooshApp.Api.csproj --configuration Release --no-restore

      - name: Run API xUnit tests
        run: dotnet test NooshApp.Api.Tests/NooshApp.Api.Tests.csproj --configuration Release --verbosity normal

      - name: Publish API project
        run: dotnet publish NooshApp.Api/NooshApp.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nooshapp-api-wil'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
